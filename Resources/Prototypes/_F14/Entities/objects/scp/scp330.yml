- type: entity
  id: SCP330
  name: SCP-330
  description: "Small round stainless steel bowl filled with a variable amount of individually wrapped pieces of candy. Taped to the side of the bowl is a handwritten note, reading “take no more than two, please!!”."
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _F14/objects/SCP/scp330.rsi
    state: icon
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: SCP330


- type: entity
  parent: BaseItem
  id: BaseSCP330Candy
  abstract: true
  name: "Цукерка SCP-330"
  description: "Small and sweat looking candy in a shining wrap"
  components:
  - type: Food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30

# red one
- type: entity
  parent: BaseSCP330Candy
  id: SCP330Candy1
