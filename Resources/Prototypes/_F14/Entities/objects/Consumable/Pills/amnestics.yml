# ==================================
# Reagents
# ==================================
- type: reagent
  id: AmnesticClassA
  name: f14-reagent-amnestic-a-name
  group: Medicine
  desc: f14-reagent-amnestic-a-desc
  physicalDesc: f14-reagent-amnestic-a-physical-desc
  flavor: chalky
  color: "#FFFFFF"
  metabolisms:
    Poison:
      metabolismRate: 1
      effects:
      - !type:RPMessageEffect
        message: "You forgot, what happend last hour"
      - !type:GenericStatusEffect
        key: Drunk
        component: Drunk
        time: 5.0

- type: reagent
  id: AmnesticClassB
  name: f14-reagent-amnestic-b-name
  group: Medicine
  desc: f14-reagent-amnestic-b-desc
  physicalDesc: f14-reagent-amnestic-b-physical-desc
  flavor: bitter
  color: "#42f56f"
  metabolisms:
    Poison:
      metabolismRate: 1
      effects:
      - !type:RPMessageEffect
        message: "You forgot what happend last 6 hours."
      - !type:GenericStatusEffect
        key: Drunk
        component: Drunk
        time: 15.0

- type: reagent
  id: AmnesticClassC
  name: f14-reagent-amnestic-c-name
  group: Medicine
  desc: f14-reagent-amnestic-c-desc
  physicalDesc: f14-reagent-amnestic-c-physical-desc
  flavor: metallic
  color: "#f54242"
  metabolisms:
    Poison:
      metabolismRate: 2
      effects:
      - !type:RPMessageEffect
        message: "You forgot everything that happend last day."
      - !type:GenericStatusEffect
        key: ForcedSleep
        component: ForcedSleeping
        time: 10.0
      - !type:GenericStatusEffect
        key: Drunk
        component: Drunk
        time: 15.0

- type: reagent
  id: AmnesticClassD
  name: f14-reagent-amnestic-d-name
  group: Medicine
  desc: f14-reagent-amnestic-d-desc
  physicalDesc: f14-reagent-amnestic-d-physical-desc
  flavor: smokey
  color: "#000000"
  metabolisms:
    Poison:
      metabolismRate: 2
      effects:
      - !type:RPMessageEffect
        message: "You forgot everything, where are you? Who are you? WHO ARE THOSE PEOPLE?!"
      - !type:HealthChange
        damage:
          types:
            Cellular: 2 
      - !type:GenericStatusEffect
        key: ForcedSleep
        component: ForcedSleeping
        time: 20.0
      - !type:GenericStatusEffect
        key: Jitter
        component: Jittering
        time: 15.0

# ==================================
# Pills
# ==================================
- type: entity
  parent: Pill
  id: PillAmnesticClassA
  name: Class-A Amnestic pill
  description: A standard Foundation memory-wiping pill. Erases the last few hours.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/pills.rsi
    state: pill1
    color: "#FFFFFF"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: AmnesticClassA
          Quantity: 15

- type: entity
  parent: Pill
  id: PillAmnesticClassB
  name: Class-B Amnestic pill
  description: A strong Foundation memory-wiping pill. Erases the last few days.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/pills.rsi
    state: pill2
    color: "#42f56f"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: AmnesticClassB
          Quantity: 15

- type: entity
  parent: Pill
  id: PillAmnesticClassC
  name: Class-C Amnestic pill
  description: A heavy-duty Foundation memory-wiping pill. Target will wake up with no recent memories.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/pills.rsi
    state: pill3
    color: "#f54242"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: AmnesticClassC
          Quantity: 15

- type: entity
  parent: Pill
  id: PillAmnesticClassD
  name: Class-D Amnestic pill
  description: EXTREME DANGER. Induces complete memory wipe and potential brain death.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/pills.rsi