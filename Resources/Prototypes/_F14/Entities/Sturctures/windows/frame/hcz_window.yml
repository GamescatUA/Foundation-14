- type: entity
  id: SCPHCZWindow
  parent: SCPBaseWindow
  name: heavy containment zone window
  description: A heavily armored glass panel designed to withstand extreme force in the HCZ.
  components:
  - type: Sprite
    noRot: true  
    sprite: _F14/Structures/windows/hczwindow.rsi
    state: hczwindow0
  - type: Icon
    sprite: _F14/Structures/windows/hczwindow.rsi
    state: hczwindow0
  - type: IconSmooth
    mode: CardinalFlags
    key: windows
    additionalKeys:
    - walls
    - doors
    base: hczwindow
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 5
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic # Робить скло стійкішим до певних типів шкоди
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400 # Значно важче розбити
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma: # Можна змінити на спеціальне скло
            min: 2
            max: 4
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          SCPHCZWindowFrame:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: SCPHCZWindowFrame
  parent: BaseStructure
  name: heavy containment zone window frame
  description: A thick, heavily reinforced HCZ wall frame. Personnel can crawl through.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true  
    drawdepth: Walls
    sprite: _F14/Structures/windows/hczwindow.rsi
    state: hczwindow_frame0
  - type: Icon
    sprite: _F14/Structures/windows/hczwindow.rsi
    state: hczwindow_frame0
  - type: IconSmooth
    mode: CardinalFlags
    key: windows
    additionalKeys:
    - walls
    - doors
    base: hczwindow_frame
  - type: PlacementReplacement
    key: walls
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 400 # Важча рамка
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800 # Дуже міцна рамка
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel: # Випадає пласталь замість звичайної сталі
            min: 1
            max: 1
  - type: Climbable
  - type: StaticPrice
    price: 50
