#guard Helmet
- type: entity
  parent: [ClothingHeadHelmetBase, BaseSecurityContraband, ClothingHeadHelmetBaseFoldable] # Goob - ClothingHeadHelmetBaseFoldable
  id: GuardHelmet
  name: Guard helmet
  description: Basic helmet used by foundation guards. Provides decent protection. Yet it seems visor should be able to open, but it doesn't. Maybe it's just a design choice?
  components:
  - type: Sprite
    sprite: _F14/Clothing/Head/Helmets/guard.rsi
  - type: Clothing
    sprite: _F14/Clothing/Head/Helmets/guard.rsi
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.35
        Radiation: 0.75
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: FaceHuggerBlocker # Goobstation
  #- type: HideLayerClothing    #Goobstation
  #  layers:
  #    Hair: HEAD

- type: entity
  parent: ClothingHeadHelmetArmoredBase
  id: ClothingHeadMTFTacticalNVG
  name: Tactical helmet
  description: Tactical helmet with NVG.
  components:
  - type: Sprite
    sprite: _F14/Clothing/Head/Helmets/mtf_tactical.rsi
    layers:
    - state: icon
    - state: icon_on
      map: ["light"]
      visible: false
  - type: Appearance
  - type: Clothing
    sprite: _F14/Clothing/Head/Helmets/mtf_tactical.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: NightVision
    isEquipment: true 
  - type: ItemToggle
    predictable: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-HELMET_on
  - type: ToggleClothing
    action: ActionToggleMTFNVG
    mustEquip: true

- type: entity
  parent: BaseAction
  id: ActionToggleMTFNVG
  name: Change visor state
  description: Lowers or raises the tactical visor.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

    
