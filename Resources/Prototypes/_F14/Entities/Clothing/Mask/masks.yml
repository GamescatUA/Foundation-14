- type: entity
  parent: [ClothingMaskGas, BaseSecurityContraband]
  id: ClothingMaskGasCI
  name: Chaos Insurgency gas mask
  description: Old soviet -style gas mask used by the Chaos Insurgency. It's not the best, but it gets the job done.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _F14/Clothing/Mask/CIGas.rsi
  - type: Clothing
    sprite: _F14/Clothing/Mask/CIGas.rsi
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: Hailer # Goobstation - Hailer
  - type: IngestionBlocker # Goobstation
    blockSmokeIngestion: true
    
