- type: entity
  name: SCP-457
  id: MobSCP457
  parent: SimpleMobBase
  description: It's humanoid looking entity that is covered in flames
  components:
  - type: SCP457
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: SCP457FireImmune
  - type: MobState
