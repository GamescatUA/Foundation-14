        Heat: 30
    animation: WeaponArcClaw
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: Sprite
    netsync: false
    sprite: _F14/Mobs/scp457.rsi  
    layers:
    - map: [ "enum.SCP457VisualLayers.Base" ]  
      state: idle
      shader: unshaded
  - type: PointLight
    radius: 4.0
    energy: 3.0
    color: "#FF6A00"   
    castShadows: false 
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.0
    baseSprintSpeed: 4.0
  

  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: NPCRetaliation
