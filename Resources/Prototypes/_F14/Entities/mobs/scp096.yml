- type: entity
  id: SCP096
  parent: SimpleMobBase
  name: SCP-096
  components:
  - type: SCP096
    calmSpeed: 0
    enragedSpeed: 25 
    chargeTime: 20
    idleSound:
      collection: scp096cry
    chargeSound:
      collection: scp096screaming
    enrageSound:
      collection: scp096chase
  - type: Sprite
    sprite: _F14/Mobs/scp096.rsi
    layers:
    - map: [ "base" ]
      state: alive
  - type: Appearance
  - type: MeleeWeapon
    angle: 30
    animation: WeaponArcSlash
    wideAnimation: WeaponArcSlash
    soundHit:
      path: /Audio/Effects/bite.ogg
    soundNoDamage:
      path: /Audio/Weapons/punchmiss.ogg
    damage:
      types:
        Slash: 70
        Piercing: 30 
  - type: GenericVisualizer
    visuals:
      enum.SCP096Visuals.State:
        base:
          Idle: { state: "alive" }
          Charging: { state: "screaming" }
          Enraged: { state: "running" }
          Dead: { state: "dead" } 
  - type: NPCRetaliation
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: Barotrauma
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0
  - type: Temperature
    coldDamageThreshold: 0
    heatDamageThreshold: 10000
