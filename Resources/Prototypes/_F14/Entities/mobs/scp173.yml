- type: entity
  id: MobSCP173
  parent: SimpleMobBase
  name: SCP-173 "The Sculpture"
  description: Huge and strange looking Sculpture
  components:
  - type: SCPFreezeOnSight
    walkSpeed: 8
    sprintSpeed: 12
  - type: Sprite
    sprite: _F14/Mobs/scp173.rsi
    state: alive
    scale: 1,1
  - type: Damageable
    damageContainer: Inorganic
  - type: MobState
    allowedStates:
    - Alive
  # SCP-173 cannot be destroyed; Alive is its only allowed state, so mark it with
  # the engine's invincibility component rather than leaving an unreachable death.
  - type: Godmode
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 175
    soundHit:
      collection: SCP173NeckBreak 
  - type: FootstepModifier
    footstepSoundCollection:
      collection: SCP173Footsteps
  - type: HTN
    rootTask:
      task: SimpleHostileCompound 
  - type: NpcFactionMember
    factions:
    - SimpleHostile
