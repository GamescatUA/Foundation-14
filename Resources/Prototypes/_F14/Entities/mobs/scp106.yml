- type: entity
  name: SCP-106
  id: MobSCP106
  parent: SimpleMobBase
  description: You see a big and black figure that appears to be an elderly humanoid, with a general appearance of advanced decomposition.
  components:
  - type: SCP106
  - type: Damageable
    damageModifierSet: AdvancedSpirit
  - type: MobState
    allowedStates:
      - Alive
  - type: MobThresholds
    thresholds:
      0: Alive
  - type: Hunger
  - type: Thirst
  - type: MeleeWeapon
    damage:
      types:
        Caustic: 25
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/_F14/Effects/SCP/scp106_touch.ogg
      params:
        volume: -3
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: Sprite
    netsync: false
    sprite: _F14/Mobs/scp106.rsi
    layers:
    - map: [ "enum.SCP106VisualLayers.Base" ]
      state: alive
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: Metabolizer
  - type: Barotrauma
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0
  - type: Temperature
    coldDamageThreshold: 0
    heatDamageThreshold: 10000

- type: entity
  id: ActionSCP106ToggleSubmerge
  name: "Toggle Submerge"
  description: "Allows SCP-106 to hide under the floor and wall textures."
  components:
  - type: Action
    icon: _F14/Interface/VerbIcons/arrow_up.png
  - type: InstantAction
    event: !type:SCP106ToggleSubmersionEvent

- type: entity
  id: ActionSCP106MoveUp
  name: "Move Up (Multi-Z)"
  description: "Moves you to the floor above. Only possible while submerged."
  components:
  - type: Action
    icon: _F14/Interface/VerbIcons/arrow_down.png
  - type: InstantAction
    event: !type:SCP106MoveUpEvent

- type: entity
  id: ActionSCP106MoveDown
  name: "Move Down (Multi-Z)"
  description: "Moves you to the floor below. Only possible while submerged."
  components:
  - type: Action
    icon: _F14/Interface/VerbIcons/arrow_down.png
  - type: InstantAction
    event: !type:SCP106MoveDownEvent


- type: entity
  id: MarkerPocketDimension
  name: Pocket Dimension Spawn
  description: A spawn point for SCP-106 victims.
  components:
  - type: SCPPocketDimension
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Markers/cross.rsi
    state: green
